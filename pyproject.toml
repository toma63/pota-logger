[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pota-logger"
version = "0.1.0"
description = "Interactive Parks On The Air (POTA) activation logger with QRZ.com lookups and ADIF export"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "SQLAlchemy>=2.0",
    "questionary>=2.0",
    "requests>=2.28",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pota = "pota_logger.cli:main"

[tool.setuptools]
packages = ["pota_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
